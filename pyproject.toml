[project]
name = "lemonade-vlm-finetune"
version = "0.1.0"
description = "Finetune Qwen2.5-VL-3B on the LEMONADE VQA benchmark (EPFL-Smart-Kitchen-30)"
requires-python = "==3.11.*"
dependencies = [
    # 데이터 준비 (다운로드 / 분할 / 변환 / 프레임 추출)
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "remotezip>=0.12",
    "huggingface-hub>=0.25",
]

# 학습에 필요한 무거운 패키지(torch 등)는 별도 그룹.
# RTX 5070(Blackwell)은 CUDA 12.8 빌드가 필요하므로 cu128 인덱스에서 받는다.
[dependency-groups]
train = [
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=4.49",
    "accelerate>=1.0",
    "datasets>=3.0",
    "peft>=0.13",
    "bitsandbytes>=0.44",   # QLoRA(4비트) 학습용
    "qwen-vl-utils>=0.0.8", # Qwen2.5-VL 이미지 입력 전처리
    "tqdm>=4.66",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.setuptools]
py-modules = []
