# 스모크 테스트: 데이터 로드 + 4비트 양자화 + 몇 스텝 학습이 도는지만 확인.
# 실제 학습이 아니라 파이프라인 검증용. 몇 분 안에 끝나야 정상.
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
trust_remote_code: true
image_max_pixels: 200704
video_max_pixels: 65536

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
quantization_bit: 4
quantization_method: bnb
freeze_vision_tower: true
freeze_multi_modal_projector: true

dataset: lemonade_train
dataset_dir: data/converted
template: qwen2_vl
cutoff_len: 4096
max_samples: 24                 # ← 24개만
overwrite_cache: true
preprocessing_num_workers: 2

output_dir: out/smoke
logging_steps: 1
save_steps: 1000
plot_loss: false
overwrite_output_dir: true
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 4  # 24/4 ≈ 6 스텝
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: constant
bf16: true
gradient_checkpointing: true
